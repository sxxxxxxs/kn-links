(function(){
  var KEY = "kainomi_age_ok";
  var gate = document.getElementById("gate"), main = document.getElementById("main");
  function show(){ gate.hidden = true; main.hidden = false; }
  try { if (localStorage.getItem(KEY) === "1") show(); } catch(e) {}
  document.getElementById("gateYes").addEventListener("click", function(){
    try { localStorage.setItem(KEY, "1"); } catch(e) {}
    show();
  });
  document.getElementById("gateNo").addEventListener("click", function(){
    location.href = "https://www.google.com";
  });

  var state = { sort: "added", genre: "" };
  var grid = document.getElementById("grid"), none = document.getElementById("none");

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function render(){
    var list = ITEMS.filter(function(it){
      if (!state.genre) return true;
      return it.genres.some(function(g){ return g.indexOf(state.genre) !== -1; });
    });
    list.sort(function(a, b){
      if (state.sort === "review") return (b.review || 0) - (a.review || 0);
      if (state.sort === "date") return (b.date || "").localeCompare(a.date || "");
      return (b.added || "").localeCompare(a.added || "");
    });
    none.hidden = list.length > 0;
    grid.innerHTML = list.map(function(it){
      var meta = [];
      if (it.actress && it.actress.length) meta.push(it.actress.join("・"));
      if (it.review) meta.push("★" + it.review);
      if (it.date) meta.push(it.date);
      return '<article class="card">' +
        '<div class="player" data-embed="' + esc(it.embed) + '">' +
          '<img src="' + esc(it.img) + '" alt="" loading="lazy">' +
          '<div class="play"><span>▶</span></div>' +
        '</div>' +
        '<h3>' + esc(it.title) + '</h3>' +
        '<p class="meta">' + esc(meta.join(" / ")) + '</p>' +
        '<a class="go" href="' + esc(it.url) + '" rel="nofollow noopener" target="_blank">本編を見る →</a>' +
      '</article>';
    }).join("");
  }

  // サムネイルをクリックした時だけプレイヤーを読み込む（勝手に再生させない）
  grid.addEventListener("click", function(e){
    var p = e.target.closest(".player");
    if (!p || p.dataset.loaded) return;
    p.dataset.loaded = "1";
    p.innerHTML = '<iframe src="' + p.dataset.embed + '" scrolling="no" frameborder="0" allowfullscreen></iframe>';
  });

  document.querySelectorAll(".chip").forEach(function(btn){
    btn.addEventListener("click", function(){
      var key = btn.dataset.sort !== undefined ? "sort" : "genre";
      var group = key === "sort" ? "[data-sort]" : "[data-genre]";
      document.querySelectorAll(group).forEach(function(b){ b.classList.remove("on"); });
      btn.classList.add("on");
      state[key] = key === "sort" ? btn.dataset.sort : btn.dataset.genre;
      render();
    });
  });

  render();
})();
</script>
